  # --- Datos crudos para investigar posición/ruta (solo lectura) ---------
  # El estado es el DP 5 tal cual lo envía el robot; el resto son atributos.
  # Los DP 42, 43, 53 y 128 solo existen en local (no están en la
  # especificación de Tuya IoT).
  - entity: sensor
    name: Conga datos crudos
    icon: "mdi:code-json"
    category: diagnostic
    dps:
      - id: 5
        type: string
        name: sensor
      - id: 4
        type: string
        optional: true
        name: dp_4_mode
      - id: 14
        type: string
        optional: true
        name: dp_14_path_data
      - id: 15
        type: string
        optional: true
        name: dp_15_command_trans
      - id: 42
        type: string
        optional: true
        name: dp_42
      - id: 43
        type: string
        optional: true
        name: dp_43
      - id: 53
        type: string
        optional: true
        name: dp_53
      - id: 128
        type: string
        optional: true
        name: dp_128

  # --- Limpiar habitación (EXPERIMENTAL) -------------------------------------
  # Escribe en el DP 15 la trama "limpieza por habitaciones" (comando 0x14) de
  # Tuya. Probado a mano con la Cocina: el robot va directo a esa habitación.
  # El resto de tramas usan el mismo formato y no están probadas.
  # Ojo: el robot empieza a limpiar nada más recibirla, sin comprobar su estado.
  - entity: select
    name: Limpiar habitación
    icon: "mdi:robot-vacuum"
    dps:
      - id: 15
        type: base64
        name: option
        persist: false
        mapping:
          - dps_val: "qgEAAAAEFAEBBx0="
            value: "Cocina"
          - dps_val: "qgEAAAAEFAIBBx4="
            value: "Cocina (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBBBo="
            value: "Salón"
          - dps_val: "qgEAAAAEFAIBBBs="
            value: "Salón (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBAxk="
            value: "Pasillo"
          - dps_val: "qgEAAAAEFAIBAxo="
            value: "Pasillo (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBBhw="
            value: "Baño"
          - dps_val: "qgEAAAAEFAIBBh0="
            value: "Baño (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBARc="
            value: "Habitación"
          - dps_val: "qgEAAAAEFAIBARg="
            value: "Habitación (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBCB4="
            value: "Estudio (sótano)"
          - dps_val: "qgEAAAAEFAIBCB8="
            value: "Estudio (sótano) (2 pasadas)"
          - dps_val: "qgEAAAAEFAEBAhg="
            value: "Entrada"
          - dps_val: "qgEAAAAEFAIBAhk="
            value: "Entrada (2 pasadas)"
          - dps_val: "qgEAAAAJFAEGBwQDBgEIOA=="
            value: "Plan completo (tu plan)"
          - dps_val: "qgEAAAAJFAIGBwQDBgEIOQ=="
            value: "Plan completo (tu plan) (2 pasadas)"
