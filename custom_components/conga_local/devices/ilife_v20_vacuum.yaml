          - dps_val: cleaning
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: cleaning
          - dps_val: pos_arrived
            value: cleaning
          - dps_val: pos_unarrive
            value: cleaning
          - dps_val: goto_charge
            value: returning
          - dps_val: select_room
            value: cleaning
          - dps_val: selecting_room
            value: cleaning
          - dps_val: seek_dust_bucket
